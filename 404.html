  *{box-sizing:border-box;}
  body{

  a.btn{

  }
  a.btn-primary{background:linear-gradient(135deg, var(--gold), #d16f0a); color:#1a0f00; box-shadow:0 10px 26px rgba(232,138,18,0.35);}
  a.btn-primary:hover{transform:translateY(-2px);}
  a.btn-ghost{background:var(--card); color:var(--text); border:1px solid var(--border);}
  a.btn-ghost:hover{border-color:var(--gold-soft);}
</style>
